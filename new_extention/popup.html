<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SentinelAI</title>

  <style>
    :root {
      --bg: #07090d;
      --panel: #0d1118;
      --panel-2: #10151d;
      --border: #1c2430;
      --border-light: #27313f;

      --text: #f1f5f9;
      --text-muted: #8b96a7;
      --text-dim: #5d6878;

      --green: #5ee89a;
      --yellow: #f3c969;
      --red: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 360px;
      min-height: 430px;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 18px;
    }

    button {
      font: inherit;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-mark {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border-light);
      border-radius: 7px;

      color: var(--green);
      font-size: 13px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;

      color: var(--text-dim);
      font-size: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--text-muted);
      font-size: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--green);

      box-shadow:
        0 0 8px rgba(94, 232, 154, 0.5);
    }

    .status-dot.offline {
      background: var(--red);

      box-shadow:
        0 0 8px rgba(255, 107, 107, 0.35);
    }

    /* SUMMARY */

    .section {
      padding: 18px 0;

      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--text-dim);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .summary-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 10px;
    }

    .metric {
      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--panel);
    }

    .metric-label {
      color: var(--text-muted);

      font-size: 10px;
    }

    .metric-value {
      margin-top: 5px;

      font-size: 22px;
      font-weight: 700;
    }

    .metric-value.high {
      color: var(--red);
    }

    /* MCP */

    .mcp-list {
      margin-top: 10px;
    }

    .mcp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 9px 0;

      border-bottom: 1px solid rgba(39, 49, 63, 0.55);

      color: var(--text-muted);
      font-size: 11px;
    }

    .mcp-row:last-child {
      border-bottom: 0;
    }

    .mcp-value {
      color: var(--text);
      font-weight: 700;
    }

    /* ACTIONS */

    .actions {
      padding-top: 18px;
    }

    .scan-button {
      width: 100%;
      height: 38px;

      border: 0;
      border-radius: 7px;

      background: var(--green);
      color: #07120d;

      cursor: pointer;

      font-size: 11px;
      font-weight: 800;
    }

    .scan-button:hover {
      filter: brightness(1.05);
    }

    .scan-button.loading {
      opacity: 0.55;
      pointer-events: none;
    }

    .dashboard-button {
      width: 100%;
      height: 36px;

      margin-top: 8px;

      border: 1px solid var(--border-light);
      border-radius: 7px;

      background: var(--panel);
      color: var(--text);

      cursor: pointer;

      font-size: 11px;
      font-weight: 600;
    }

    .dashboard-button:hover {
      background: var(--panel-2);
    }

    /* FOOTER */

    .footer {
      margin-top: 13px;

      color: var(--text-dim);

      font-size: 9px;
      line-height: 1.5;

      text-align: center;
    }

    .error {
      color: var(--red);

      font-size: 10px;
      line-height: 1.5;
    }

    .summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.summary-grid .metric:nth-child(3) {
  grid-column: 1 / -1;
}
  </style>
</head>

<body>

  <header class="header">

    <div>
      <div class="brand">
        <div class="brand-mark">S</div>
        <div class="brand-name">SentinelAI</div>
      </div>

      <div class="subtitle">
        Personal AI attack surface auditor
      </div>
    </div>

    <div class="status">

      <span
        class="status-dot"
        id="status-dot"
      ></span>

      <span id="status-text">
        Agent
      </span>

    </div>

  </header>


  <!-- SUMMARY -->

  <section class="section">

    <div class="eyebrow">
      Security summary
    </div>

    <div class="summary-grid">

  <div class="metric">
    <div class="metric-label">
      Tools watched
    </div>

    <div
      class="metric-value"
      id="tool-count"
    >
      —
    </div>
  </div>

  <div class="metric">
    <div class="metric-label">
      3rd-party apps
    </div>

    <div
      class="metric-value"
      id="oauth-app-count"
    >
      —
    </div>
  </div>

  <div class="metric">
    <div class="metric-label">
      High risk
    </div>

    <div
      class="metric-value high"
      id="high-count"
    >
      —
    </div>
  </div>

</div>

  </section>


  <!-- MCP -->

  <section class="section">

    <div class="eyebrow">
      MCP detected
    </div>

    <div class="mcp-list">

      <div class="mcp-row">
        <span>Local MCP</span>

        <span
          class="mcp-value"
          id="local-mcp-count"
        >
          —
        </span>
      </div>


      <div class="mcp-row">
        <span>Web MCP</span>

        <span
          class="mcp-value"
          id="web-mcp-count"
        >
          —
        </span>
      </div>

    </div>

  </section>


  <!-- INVENTORY -->

  <section class="section">

    <div class="eyebrow">
      Inventory
    </div>

    <div class="mcp-row">

      <span>Extensions</span>

      <span
        class="mcp-value"
        id="extension-count"
      >
        —
      </span>

    </div>

  </section>


  <!-- ACTIONS -->

  <section class="actions">

    <button
      id="scan-button"
      class="scan-button"
      type="button"
    >
      Scan now
    </button>


    <button
      id="dashboard-button"
      class="dashboard-button"
      type="button"
    >
      Open full dashboard
    </button>

  </section>


  <div class="footer">
    Detailed security information is available
    in the full SentinelAI dashboard.
  </div>


  <script src="popup.js"></script>

</body>
</html>
