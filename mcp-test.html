<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelAI MCP Detection Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:hover {
      background: #e8e8e8;
    }

    #log {
      margin-top: 25px;
      padding: 15px;
      background: #111;
      color: #00ff88;
      border-radius: 8px;
      min-height: 250px;
      white-space: pre-wrap;
      font-family: monospace;
      overflow-x: auto;
    }

    .status {
      padding: 12px;
      background: #f1f1f1;
      border-radius: 6px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1>SentinelAI MCP Detection Test</h1>

  <p class="subtitle">
    This page generates browser-visible MCP / JSON-RPC traffic
    for testing the SentinelAI web sensor.
  </p>

  <div class="status">
    <strong>Test endpoint:</strong>
    <code>/mcp</code>
  </div>

  <button onclick="testPromptsList()">
  Test prompts/list
</button>

<button onclick="testPing()">
  Test ping
</button>
 
  <div id="log"></div>

  <script>
  const MCP_ENDPOINT = "/mcp";

  function log(message) {
    const logElement = document.getElementById("log");
    const timestamp = new Date().toLocaleTimeString();

    logElement.textContent +=
      `[${timestamp}] ${message}\n`;

    logElement.scrollTop = logElement.scrollHeight;
  }

  function clearLog() {
    document.getElementById("log").textContent = "";
  }

  function makeRequest(method, params = {}) {
    return {
      jsonrpc: "2.0",
      id: Date.now(),
      method,
      params
    };
  }

  async function sendMcpRequest(method, params = {}) {
    const request = makeRequest(method, params);

    log(`MCP REQUEST → ${method}`);
    log(`POST ${MCP_ENDPOINT}`);

    try {
      const response = await fetch(MCP_ENDPOINT, {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json, text/event-stream"
        },

        body: JSON.stringify(request)
      });

      log(
        `MCP RESPONSE ← ${response.status} ${response.statusText}`
      );

      const text = await response.text();

      log(
        `Response: ${text.substring(0, 300)}`
      );

    } catch (error) {

      /*
       * There does not need to be an MCP server.
       *
       * SentinelAI is testing the browser-side network
       * activity generated by this page.
       */

      log(
        `Browser request ended with error: ${error.message}`
      );
    }
  }


  async function testInitialize() {

    await sendMcpRequest(
      "initialize",
      {
        protocolVersion: "2025-06-18",

        capabilities: {
          roots: {
            listChanged: true
          },

          sampling: {}
        },

        clientInfo: {
          name: "SentinelAI-Test-Client",
          version: "1.0.0"
        }
      }
    );
  }


  async function testToolsList() {

    await sendMcpRequest(
      "tools/list",
      {}
    );
  }


  async function testToolsCall() {

    await sendMcpRequest(
      "tools/call",
      {
        name: "sentinel_test_tool",

        arguments: {
          message:
            "SentinelAI MCP detection test"
        }
      }
    );
  }


  async function testResourcesList() {

    await sendMcpRequest(
      "resources/list",
      {}
    );
  }


  async function testPromptsList() {

    await sendMcpRequest(
      "prompts/list",
      {}
    );
  }


  async function testPing() {

    await sendMcpRequest(
      "ping",
      {}
    );
  }


  function testXHR() {

    const xhr = new XMLHttpRequest();

    const request = makeRequest(
      "tools/list",
      {}
    );

    log("MCP XHR REQUEST → tools/list");

    xhr.open(
      "POST",
      MCP_ENDPOINT,
      true
    );

    xhr.setRequestHeader(
      "Content-Type",
      "application/json"
    );

    xhr.setRequestHeader(
      "Accept",
      "application/json, text/event-stream"
    );

    xhr.onload = function() {

      log(
        `XHR RESPONSE ← ${xhr.status}`
      );

      log(
        `XHR body: ${(
          xhr.responseText || ""
        ).substring(0, 300)}`
      );
    };

    xhr.onerror = function() {

      log(
        "XHR produced a browser network error."
      );
    };

    xhr.send(
      JSON.stringify(request)
    );
  }


  /*
   * This generates a URL containing an MCP hint.
   *
   * It is useful for testing SentinelAI's performance-resource
   * URL detection as well.
   */
  async function testMcpHintUrl() {

    const endpoint =
      "/mcp?sentinel_test=1";

    log(
      `MCP HINT REQUEST → ${endpoint}`
    );

    try {

      await fetch(
        endpoint,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(
            makeRequest(
              "resources/list",
              {}
            )
          )
        }
      );

    } catch (error) {

      log(
        `MCP hint request error: ${error.message}`
      );
    }
  }


  async function runAllTests() {

    clearLog();

    log(
      "======================================"
    );

    log(
      "SentinelAI MCP Detection Test"
    );

    log(
      "Generating browser MCP traffic..."
    );

    log(
      "======================================"
    );


    await testInitialize();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testToolsList();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testToolsCall();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testResourcesList();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testPromptsList();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testPing();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    testXHR();

    await new Promise(
      resolve => setTimeout(resolve, 300)
    );


    await testMcpHintUrl();


    log("");

    log(
      "======================================"
    );

    log(
      "MCP traffic generated."
    );

    log(
      "Now click SentinelAI → Scan now."
    );

    log(
      "======================================"
    );
  }


  /*
   * Do NOT automatically generate traffic here.
   *
   * SentinelAI itself is supposed to be on-demand.
   */

  log(
    "Fake MCP test page ready."
  );

  log(
    "Click 'Run ALL MCP Tests' to generate traffic."
  );
</script>

</body>
</html>
